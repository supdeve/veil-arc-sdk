name: Deploy the documentation site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the site is published either by the legacy branch build or by the
      # GitHub Actions build; the workflow follows whatever the site is set to
      - name: Detect the Pages build type
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq '.build_type' 2>/dev/null || echo legacy)
          echo "build_type=$build_type" >> "$GITHUB_OUTPUT"
      - name: Publish the site to the gh-pages branch
        if: steps.pages.outputs.build_type != 'workflow'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cd website
          git init -b gh-pages
          git add -A
          git commit -m "docs: deploy the developer site"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" gh-pages
      - uses: actions/upload-pages-artifact@v5
        if: steps.pages.outputs.build_type == 'workflow'
        with:
          path: './website'
      - id: deployment
        if: steps.pages.outputs.build_type == 'workflow'
        uses: actions/deploy-pages@v5
